[package]
name = "goblin-io"
version = "0.0.0"  # gilt nicht – die Version kommt aus package.json (tauri.conf.json)
description = "Goblin.io"
authors = ["EinFabo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "goblin_io_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# goblinio://… bringt nach der Google-Anmeldung im Browser das Spiel zurück nach vorn
tauri-plugin-deep-link = "2"
serde_json = "1"

# Auto-Update gibt es nur am Desktop; Android prüft im Spiel selbst (src/app-update.js)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Ein goblinio://-Link startet kein zweites Fenster, sondern holt das laufende Spiel nach vorn
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
