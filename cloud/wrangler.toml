# Cloud-Sync für Goblin.io (PLAN.md, Phase 8): ein Worker auf goblin.node-wave.org liefert das Spiel aus
# und bietet unter /api Anmeldung (Google-ID-Token), Laden und Speichern. Spielstände liegen in D1.
#   npm run dev      lokal mit Test-Anmeldung (Token "dev:<name>")
#   npm run deploy   baut das Spiel, wendet Migrationen an und lädt hoch (CLOUDFLARE_API_TOKEN nötig)
name = "goblin"
main = "src/index.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "goblin.node-wave.org", custom_domain = true }]

[assets]
directory = "./public"
run_worker_first = ["/api/*", "/verbinden", "/anmelden"]

[[d1_databases]]
binding = "DB"
database_name = "goblin"
database_id = "a4d8d64d-ffee-43cf-b1e6-c4681bd81479"
migrations_dir = "migrations"

# Koop-Raum (Phase 14d, src/room.js): ein Durable Object je Code, SQLite-Speicher
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Client-IDs aus der Google Cloud Console (Web), durch Komma getrennt; öffentlich.
# exe/APK melden sich über den Browser an (goblin.node-wave.org/verbinden), brauchen also keine eigene Client-ID.
GOOGLE_CLIENT_IDS = "207037584180-cu0m43pkkn8uuo2lkg65ijpqc3t9bd0h.apps.googleusercontent.com"
ALLOWED_ORIGINS = "https://goblin.node-wave.org,http://localhost:8080,tauri://localhost,http://tauri.localhost,https://tauri.localhost"
